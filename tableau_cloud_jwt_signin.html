<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Tableau Cloud JWT Sign-In</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6f9;margin:0;padding:24px;color:#222}
.c{max-width:860px;margin:auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 4px #0002}
h1{font-size:20px;margin-top:0}h2{font-size:15px;margin:22px 0 0;border-top:1px solid #ddd;padding-top:14px}
label{display:block;margin-top:12px;font-weight:600;font-size:13px}
input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #bbb;border-radius:4px;font-family:monospace;font-size:13px}
textarea{height:80px}button{margin-top:16px;margin-right:8px;padding:9px 16px;border:0;border-radius:4px;background:#0176d3;color:#fff;cursor:pointer}
button.s{background:#555}button.g{background:#2e844a}.row{display:flex;gap:12px}.row>div{flex:1}.note{font-size:12px;color:#666;margin-top:6px}
.err{color:#c00;margin-top:10px;white-space:pre-wrap}.ok{color:#2e844a;margin-top:10px}
pre{background:#f0f0f0;padding:10px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
</style></head><body><div class="c">
<h1>Tableau Cloud: Generate JWT &amp; Sign In</h1>
<h2>Connected App (direct trust)</h2>
<div class="row"><div><label>Client ID (iss)</label><input id="iss"></div>
<div><label>Secret ID (kid)</label><input id="kid"></div></div>
<label>Secret Value</label><input id="secret" type="password">
<label>Username / email (sub)</label><input id="sub">
<label>Scopes (comma separated)</label><input id="scp" value="tableau:content:read,tableau:workbooks:read,tableau:datasources:read">
<div class="row"><div><label>Expiry (minutes, max 10)</label><input id="exp" type="number" value="5" min="1" max="10"></div>
<div><label>Audience (aud)</label><input id="aud" value="tableau"></div></div>
<h2>Tableau Cloud</h2>
<div class="row"><div><label>Pod URL</label><input id="pod" placeholder="https://10ax.online.tableau.com"></div>
<div><label>API version</label><input id="ver" value="3.22"></div>
<div><label>Site contentUrl</label><input id="site" placeholder="mysite"></div></div>
<button onclick="gen()">Generate JWT</button>
<button class="g" onclick="signin()">Generate &amp; Sign In</button>
<button class="s" onclick="cp($('jwt').value)">Copy JWT</button>
<button class="s" onclick="cp($('curl').textContent)">Copy curl</button>
<div class="note">JWT is signed locally (HS256, Web Crypto). Sign In sends it only to the pod URL you enter. If the browser blocks the call (CORS), use the curl command.</div>
<div id="err" class="err"></div><div id="ok" class="ok"></div>
<label>JWT</label><textarea id="jwt" readonly></textarea>
<label>Sign-in request body</label><pre id="body"></pre>
<label>curl command</label><pre id="curl"></pre>
<label>Sign-in response</label><pre id="resp"></pre>
<label>Decoded payload</label><pre id="p"></pre>
</div>
<script>
const $=id=>document.getElementById(id);
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const enc=s=>b64u(new TextEncoder().encode(s));
const cp=t=>navigator.clipboard.writeText(t);
const base=()=>$('pod').value.trim().replace(/\/+$/,'');
async function gen(){
 $('err').textContent='';$('ok').textContent='';
 try{
  const iss=$('iss').value.trim(),kid=$('kid').value.trim(),sec=$('secret').value,sub=$('sub').value.trim();
  if(!iss||!kid||!sec||!sub)throw new Error('Client ID, Secret ID, Secret Value and username are required.');
  const now=Math.floor(Date.now()/1000),m=Math.min(10,Math.max(1,+$('exp').value||5));
  const header={alg:'HS256',typ:'JWT',kid,iss};
  const payload={iss,sub,aud:$('aud').value.trim()||'tableau',exp:now+m*60,iat:now,jti:crypto.randomUUID(),scp:$('scp').value.split(',').map(s=>s.trim()).filter(Boolean)};
  const data=enc(JSON.stringify(header))+'.'+enc(JSON.stringify(payload));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(sec),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const jwt=data+'.'+b64u(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(data)));
  $('jwt').value=jwt;
  $('p').textContent=JSON.stringify(payload,null,2)+'\nExpires: '+new Date(payload.exp*1000).toLocaleString();
  const body={credentials:{jwt,site:{contentUrl:$('site').value.trim()}}};
  $('body').textContent=JSON.stringify(body,null,2);
  $('curl').textContent=`curl -X POST "${base()||'https://<pod>.online.tableau.com'}/api/${$('ver').value.trim()}/auth/signin" -H "Content-Type: application/json" -H "Accept: application/json" -d '${JSON.stringify(body)}'`;
  return body;
 }catch(e){$('err').textContent=e.message}
}
async function signin(){
 const body=await gen();if(!body)return;
 if(!base()){$('err').textContent='Enter the pod URL.';return}
 try{
  const r=await fetch(`${base()}/api/${$('ver').value.trim()}/auth/signin`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(_){}
  $('resp').textContent=j?JSON.stringify(j,null,2):t;
  if(r.ok&&j?.credentials?.token){$('ok').textContent='Signed in. Token (X-Tableau-Auth) and site ID are in the response below.'}
  else $('err').textContent='Sign-in failed: HTTP '+r.status;
 }catch(e){$('err').textContent='Request failed ('+e.message+'). This is most likely CORS blocking the browser call. Use the curl command instead.'}
}
</script></body></html>
